map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}

# Empty for loopback-only development. Production mounts the one trusted Caddy IP.
include /etc/nginx/trusted-proxy.conf;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 13m;
    # Idle time between body reads, NOT a total request deadline.
    client_body_timeout 180s;
    client_header_timeout 15s;
    server_tokens off;
    # Django emits request ID/method/status/timing without URLs or Referer.
    # Default combined access logs expose private resource IDs and query strings.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /api/login/ {
        # Shared across NGINX workers; independent of Django's process-local cache.
        limit_req zone=login_per_ip burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        # Only Caddy can reach the internal web port in an HTTPS deployment.
        # The local HTTP port is loopback-only. Never publish it behind an untrusted proxy.
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Fully receive a slow multipart body before occupying a Gunicorn worker.
        # This can spill private audio to NGINX temporary disk; provision/protect it.
        proxy_request_buffering on;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    # No /media alias: every private audio read passes Django authorization.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
